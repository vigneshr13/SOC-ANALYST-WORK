title: Credential Stuffing — Multiple Failed Logins Across Accounts from Single Source
id: # TODO: generate UUID
status: experimental
description: |
    Detects potential credential stuffing attacks where a single source IP attempts
    authentication against multiple distinct user accounts in a short time window.
    Differs from brute force (single account, many passwords) by targeting many accounts.
author: Vignesh R
date: YYYY/MM/DD
modified: YYYY/MM/DD
references:
    - https://attack.mitre.org/techniques/T1110/004/
tags:
    - attack.credential_access
    - attack.t1110.004
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    filter:
        TargetUserName|endswith: '$'
    timeframe: 5m
    condition: selection and not filter | count(TargetUserName) by IpAddress > 10
fields:
    - IpAddress
    - TargetUserName
    - LogonType
    - WorkstationName
falsepositives:
    - Vulnerability scanners testing authentication endpoints
    - Automated monitoring tools checking service account health
    - IT admin tools testing credentials across multiple systems
level: high

# ============================================================
# Conversion Commands:
#   sigma-cli convert -t splunk -p sysmon credential_stuffing.yml
#   sigma-cli convert -t wazuh credential_stuffing.yml
# ============================================================
